name: Build
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        run: mvn -B package -DskipTests
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: CoreProtect
          path: target/CoreProtect-*.jar
